<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const supabase=createClient('https://dlvzeudetcknacgwybnw.supabase.co','sb_publishable_p0hmFGquUZRtOA9EWGrZQw_A1uGWa_G');
const root=document.querySelector('#root');let movements=[],categories=[],section='overview',selectedMonth=new Date().toISOString().slice(0,7),status='all',ownerFilter='all',freshMovementId=null;
const euro=n=>new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(n||0);const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const active=m=>m.state==='paid'||m.state==='collected';const monthItems=()=>movements.filter(m=>m.movement_date?.startsWith(selectedMonth));
function login(){root.innerHTML=`<div class="login"><form class="login-card" id="login"><img class="logo" src="/icons/iki-studio-logo.png"><h1>IKI Studio</h1><p>Area riservata a Carmen e Veronica</p><label class="field">Email condivisa<input type="email" name="email" required></label><label class="field">Password<input type="password" name="password" required></label><button class="primary">Accedi</button><div id="err" class="error"></div></form></div>`;document.querySelector('#login').onsubmit=async e=>{e.preventDefault();const d=new FormData(e.target);const {error}=await supabase.auth.signInWithPassword({email:d.get('email'),password:d.get('password')});if(error)document.querySelector('#err').textContent='Email o password non corrette.';else start()}}
async function load(){const [a,b]=await Promise.all([supabase.from('iki_movements').select('*').order('movement_date',{ascending:false}),supabase.from('iki_categories').select('*').order('name')]);if(a.error||b.error)throw Error(a.error?.message||b.error?.message);movements=a.data||[];categories=b.data||[]}
function nav(){const labels={overview:['Panoramica','Home'],monitor:['Monitor','Trend'],invoices:['Fatture','Fatture'],expenses:['Uscite','Uscite'],deadlines:['Scadenze','Date'],categories:['Gestione voci','Voci']};return Object.keys(labels).map(x=>`<button class="${section===x?'active':''}" data-nav="${x}" data-short="${labels[x][1]}">${labels[x][0]}</button>`).join('')}
function row(m){const income=m.kind==='invoice';return `<div class="row"><div class="detail"><b>${esc(m.title)}</b><span>${income?esc(m.counterpart):esc(categories.find(c=>c.id===m.category_id)?.name||'Senza categoria')}</span></div><div class="amount">${income?'+':'−'} ${euro(m.amount)}<span class="state ${m.state}">${({expected:'Prevista',awaiting:'Da incassare',collected:'Incassata',planned:'Prevista',paid:'Pagata',overdue:'In ritardo'})[m.state]||m.state}</span></div></div>`};
function richRow(m){const income=m.kind==='invoice',state=({expected:'Prevista',awaiting:'Da incassare',collected:'Incassata',planned:'Prevista',paid:'Pagata',overdue:'In ritardo'})[m.state]||m.state;const control=section==='invoices'&&m.state==='expected'?`<button class="mini-action" data-set-state="${m.id}" data-next-state="awaiting">Segna da incassare</button>`:section==='invoices'&&m.state==='awaiting'?`<button class="mini-action" data-set-state="${m.id}" data-next-state="collected">Segna incassata</button>`:section==='expenses'&&(m.state==='planned'||m.state==='overdue')?`<button class="mini-action" data-set-state="${m.id}" data-next-state="paid">Segna pagata</button>`:'';return `<div class="table-row ${m.id===freshMovementId?'is-new':''}"><time>${m.movement_date?new Date(m.movement_date+'T12:00:00').toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit',year:'numeric'}):'—'}</time><div class="table-detail"><b>${esc(m.title)}</b><span>${income?esc(m.counterpart):esc(categories.find(c=>c.id===m.category_id)?.name||'Senza categoria')}</span></div><span class="kind">${income?'Fattura':'Uscita'}</span><div class="state-cell"><span class="state ${m.state}">${state}</span>${control}</div><span class="due">${m.due_date?'Scade '+new Date(m.due_date+'T12:00:00').toLocaleDateString('it-IT',{day:'2-digit',month:'short'}):'—'}</span><strong class="amount">${income?'+':'−'} ${euro(m.amount)}</strong></div>`}
function tableRows(items){return `<div class="table-head"><span>DATA</span><span>DESCRIZIONE</span><span>TIPO</span><span>STATO</span><span>SCADENZA</span><span>IMPORTO</span></div>${items.map(richRow).join('')}`};
function overview(){const ms=monthItems(),inc=ms.filter(m=>m.kind==="invoice"&&m.state==="collected").reduce((s,m)=>s+Number(m.amount),0),out=ms.filter(m=>m.kind==="expense"&&m.state==="paid").reduce((s,m)=>s+Number(m.amount),0),forecastIncome=ms.filter(m=>m.kind==="invoice").reduce((s,m)=>s+Number(m.amount),0),forecastOut=ms.filter(m=>m.kind==="expense").reduce((s,m)=>s+Number(m.amount),0),forecast=forecastIncome-forecastOut,expected=ms.filter(m=>m.kind==="invoice"&&(m.state==="expected"||m.state==="awaiting")).reduce((s,m)=>s+Number(m.amount),0),tasks=ms.filter(m=>!active(m)&&m.due_date).sort((a,b)=>a.due_date.localeCompare(b.due_date)).slice(0,4),stateName={expected:"Prevista",awaiting:"Da incassare",collected:"Incassata",planned:"Da pagare",paid:"Pagata",overdue:"In ritardo"},taskRow=m=>{const income=m.kind==="invoice",date=new Date(m.due_date+"T12:00:00").toLocaleDateString("it-IT",{day:"2-digit",month:"short"});return `<button class="task-row" data-task-section="${income?"invoices":"expenses"}"><span class="task-type ${income?"income":"expense"}">${income?"Fattura":"Uscita"}</span><span class="task-copy"><b>${esc(m.title)}</b><small>${income?esc(m.counterpart):esc(categories.find(c=>c.id===m.category_id)?.name||"Senza categoria")} · ${stateName[m.state]}</small></span><span class="task-value"><time>${date}</time><strong>${income?"+":"−"} ${euro(m.amount)}</strong></span><span class="task-arrow">›</span></button>`};return `<section class="home-period"><div><span class="eyebrow">PANORAMICA</span><h1>Il mese, sotto controllo.</h1></div><label>Periodo <input type="month" value="${selectedMonth}" id="month"></label></section><div class="home-grid"><section class="balance-command"><div class="balance-top"><span class="eyebrow accent">DISPONIBILE ORA</span><span class="live-mark">●</span></div><strong>${euro(inc-out)}</strong><div class="forecast-line"><div><span>PROIEZIONE FINE MESE</span><b>${euro(forecast)}</b></div><small>Include ${euro(expected)} tra fatture previste e da incassare.</small></div><div class="balance-meta"><span>Incassato <b>${euro(inc)}</b></span><span>Pagato <b>${euro(out)}</b></span></div></section><section class="task-panel"><div class="panel-top"><div><span class="eyebrow">DA FARE</span><h2>${tasks.length?`${tasks.length} movimenti da seguire`:"Niente in sospeso"}</h2></div><button class="quiet-link" data-nav="deadlines">Vedi tutto ›</button></div><div class="task-list">${tasks.length?tasks.map(taskRow).join(""):`<div class="calm-empty">Nessuna scadenza aperta. Il mese è in ordine.</div>`}</div></section></div><section class="ledger-panel"><div class="panel-top"><div><span class="eyebrow">REGISTRO</span><h2>Movimenti del mese</h2></div><button class="quiet-link" data-nav="invoices">Apri fatture ›</button></div><div class="table">${ms.length?tableRows(ms.slice(0,7)):`<div class="calm-empty">Nessun movimento registrato in questo periodo.</div>`}</div><footer class="ledger-foot"><span>Entrate <b>${euro(forecastIncome)}</b></span><span>Uscite <b>${euro(forecastOut)}</b></span><span>Proiezione <b>${euro(forecast)}</b></span></footer></section>`}
function list(kind){let items=monthItems().filter(m=>m.kind===kind&&(status==='all'||m.state===status)&&(kind!=='invoice'||ownerFilter==='all'||m.entered_by===ownerFilter));const total=items.reduce((sum,m)=>sum+Number(m.amount||0),0),incassato=items.filter(m=>m.state==='collected').reduce((sum,m)=>sum+Number(m.amount||0),0),daIncassare=items.filter(m=>m.state==='awaiting'||m.state==='expected').reduce((sum,m)=>sum+Number(m.amount||0),0);const opts=kind==='invoice'?[['all','Tutte'],['expected','Previste'],['awaiting','Da incassare'],['collected','Incassate']]:[['all','Tutte'],['planned','Previste'],['paid','Pagate'],['overdue','In ritardo']];return `<div class="section-title"><h1>${kind==='invoice'?'Fatture':'Uscite'}</h1><div class="filter">${kind==='invoice'?`<select id="owner-filter"><option value="all" ${ownerFilter==='all'?'selected':''}>Carmen e Veronica</option><option value="Carmen" ${ownerFilter==='Carmen'?'selected':''}>Solo Carmen</option><option value="Veronica" ${ownerFilter==='Veronica'?'selected':''}>Solo Veronica</option></select>`:''}<select id="status">${opts.map(o=>`<option value="${o[0]}" ${status===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></div></div><section class="invoice-summary"><div><span>${kind==='invoice'?'FATTURE NEL FILTRO':'USCITE NEL FILTRO'}</span><strong>${euro(total)}</strong></div><div><span>${kind==='invoice'?'INCASSATO':'PAGATO'}</span><strong>${euro(kind==='invoice'?incassato:items.filter(m=>m.state==='paid').reduce((sum,m)=>sum+Number(m.amount||0),0))}</strong></div><div><span>${kind==='invoice'?'ATTESO / DA INCASSARE':'DA PAGARE'}</span><strong class="accent-value">${euro(kind==='invoice'?daIncassare:items.filter(m=>m.state==='planned'||m.state==='overdue').reduce((sum,m)=>sum+Number(m.amount||0),0))}</strong></div></section><div class="table">${items.length?tableRows(items):'<div class="empty">Nessun movimento per questi filtri.</div>'}</div>`}
function monitor(){const ms=monthItems(), exp={};ms.filter(m=>m.kind==='expense').forEach(m=>{let n=categories.find(c=>c.id===m.category_id)?.name||'Senza categoria';exp[n]=(exp[n]||0)+Number(m.amount)});const inc={};ms.filter(m=>m.kind==='invoice').forEach(m=>inc[m.counterpart]=(inc[m.counterpart]||0)+Number(m.amount));const bars=(o,green=false)=>{let e=Object.entries(o).sort((a,b)=>b[1]-a[1]),max=e[0]?.[1]||1;return e.length?e.map(([n,v])=>`<div class="bar"><span>${esc(n)}</span><div class="track"><div class="fill ${green?'green':''}" style="width:${v/max*100}%"></div></div><b>${euro(v)}</b></div>`).join(''):'<div class="empty">Ancora nessun dato.</div>'};return `<div class="section-title"><h1>Monitor finanziario</h1></div><div class="charts"><section class="panel"><h3>Dove spendete di più</h3>${bars(exp)}</section><section class="panel"><h3>Da chi fatturate di più</h3>${bars(inc,true)}</section></div>`}
function deadlines(){let items=movements.filter(m=>!active(m)&&m.due_date).sort((a,b)=>a.due_date.localeCompare(b.due_date));return `<div class="section-title"><h1>Scadenze</h1></div><div class="table">${items.length?tableRows(items):'<div class="empty">Nessuna scadenza aperta.</div>'}</div>`}
function cats(){const activeCats=categories.filter(c=>c.is_active),archived=categories.filter(c=>!c.is_active);return `<div class="section-title"><h1>Gestione voci</h1><button class="primary" id="add-category">＋ Aggiungi voce</button></div><section class="panel"><p style="color:var(--muted);margin-top:0">Le voci servono solo per organizzare le uscite. Disattivandole non cancelli lo storico: semplicemente non compariranno più quando aggiungi una nuova uscita.</p>${activeCats.map(c=>`<div class="row"><b>${esc(c.name)}</b><button class="icon" data-disable-cat="${c.id}">Disattiva</button></div>`).join('')||'<div class="empty">Nessuna voce attiva.</div>'}</section>${archived.length?`<section class="panel" style="margin-top:20px"><h3>Voci archiviate</h3>${archived.map(c=>`<div class="row"><b>${esc(c.name)}</b><button class="icon" data-restore-cat="${c.id}">Riattiva</button></div>`).join('')}</section>`:''}`}
function render(){let body={overview,monitor,invoices:()=>list('invoice'),expenses:()=>list('expense'),deadlines,categories:cats}[section]();root.innerHTML=`<div class="app"><aside class="side"><img class="logo" src="/icons/iki-studio-logo.png"><nav class="nav">${nav()}</nav><small>SOCIE<br><b>Carmen · Veronica</b></small></aside><div class="main"><header class="top"><div><small style="color:var(--muted)">Bentornate,</small><h2>IKI Studio</h2></div><span class="push"></span><button class="icon" id="refresh" title="Aggiorna">↻</button><button class="icon export-button" id="export" title="Esporta archivio">⇩ Esporta</button><button class="primary" id="add">＋ Aggiungi</button></header><main class="content page-enter">${body}</main></div></div>`;document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{section=b.dataset.nav;status='all';ownerFilter='all';render()});document.querySelector('#refresh').onclick=async()=>{await load();render()};document.querySelector('#export').onclick=exportModal;document.querySelector('#add').onclick=modal;if(document.querySelector('#month'))document.querySelector('#month').onchange=e=>{selectedMonth=e.target.value;render()};if(document.querySelector('#status'))document.querySelector('#status').onchange=e=>{status=e.target.value;render()};if(document.querySelector('#owner-filter'))document.querySelector('#owner-filter').onchange=e=>{ownerFilter=e.target.value;render()};document.querySelectorAll('[data-task-section]').forEach(b=>b.onclick=()=>{section=b.dataset.taskSection;status='all';render()});if(document.querySelector('#add-category'))document.querySelector('#add-category').onclick=categoryModal;document.querySelectorAll('[data-disable-cat]').forEach(b=>b.onclick=async()=>{let {error}=await supabase.from('iki_categories').update({is_active:false}).eq('id',b.dataset.disableCat);if(error){alert(error.message);return}await load();render()});document.querySelectorAll('[data-restore-cat]').forEach(b=>b.onclick=async()=>{let {error}=await supabase.from('iki_categories').update({is_active:true}).eq('id',b.dataset.restoreCat);if(error){alert(error.message);return}await load();render()});document.querySelectorAll('[data-set-state]').forEach(b=>b.onclick=async()=>{b.disabled=true;let {error}=await supabase.from('iki_movements').update({state:b.dataset.nextState}).eq('id',b.dataset.setState);if(error){alert(error.message);b.disabled=false;return}await load();render()})}
function exportModal(){const [year,month]=selectedMonth.split('-').map(Number),lastDay=String(new Date(year,month,0).getDate()).padStart(2,'0');root.insertAdjacentHTML('beforeend',`<div class="modal" id="modal"><form class="modal-card" id="export-form"><div class="modal-head"><b>Esporta archivio</b></div><div class="modal-body"><p style="margin:0;color:var(--muted);line-height:1.45">Scegli il periodo e scarica un file CSV. Puoi conservarlo su chiavetta, disco esterno o aprirlo con Excel.</p><div class="two"><label class="field">Dal<input name="from" type="date" value="${selectedMonth}-01" required></label><label class="field">Al<input name="to" type="date" value="${selectedMonth}-${lastDay}" required></label></div><label class="field">Cosa esportare<select name="kind"><option value="all">Tutto</option><option value="invoice">Solo fatture</option><option value="expense">Solo uscite</option></select></label></div><div class="modal-foot"><button type="button" class="icon" id="cancel">Annulla</button><button class="primary">Scarica CSV</button></div></form></div>`);document.querySelector('#cancel').onclick=()=>document.querySelector('#modal').remove();document.querySelector('#export-form').onsubmit=e=>{e.preventDefault();const d=new FormData(e.target),from=d.get('from'),to=d.get('to'),kind=d.get('kind'),items=movements.filter(m=>m.movement_date>=from&&m.movement_date<=to&&(kind==='all'||m.kind===kind));const q=v=>'"'+String(v??'').replaceAll('"','""')+'"',rows=[['Data','Tipo','Descrizione','Cliente / Categoria','Importo','Stato','Scadenza','Inserito da'],...items.map(m=>[m.movement_date,m.kind==='invoice'?'Fattura':'Uscita',m.title,m.kind==='invoice'?m.counterpart:(categories.find(c=>c.id===m.category_id)?.name||''),Number(m.amount||0).toFixed(2),({expected:'Prevista',awaiting:'Da incassare',collected:'Incassata',planned:'Da pagare',paid:'Pagata',overdue:'In ritardo'})[m.state]||m.state,m.due_date||'',m.entered_by||''])].map(r=>r.map(q).join(';')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\\uFEFF'+rows],{type:'text/csv;charset=utf-8'}));a.download='iki-studio-'+from+'_'+to+'.csv';document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},0);document.querySelector('#modal').remove()}}
function categoryModal(){root.insertAdjacentHTML('beforeend',`<div class="modal" id="modal"><form class="modal-card" id="new-category"><div class="modal-head"><b>Nuova voce di uscita</b></div><div class="modal-body"><label class="field">Nome della voce<input name="name" placeholder="Es. Internet" required autofocus></label></div><div class="modal-foot"><button type="button" class="icon" id="cancel">Annulla</button><button class="primary">Aggiungi voce</button></div></form></div>`);document.querySelector('#cancel').onclick=()=>document.querySelector('#modal').remove();document.querySelector('#new-category').onsubmit=async e=>{e.preventDefault();const name=new FormData(e.target).get('name').trim();let {error}=await supabase.from('iki_categories').insert({name,is_active:true});if(error){alert(error.message);return}document.querySelector('#modal').remove();await load();render()}}
function modal(){root.insertAdjacentHTML('beforeend',`<div class="modal" id="modal"><form class="modal-card" id="new"><div class="modal-head"><b>Nuovo movimento</b></div><div class="modal-body"><div class="two"><label class="field">Tipo<select name="kind"><option value="invoice">Fattura</option><option value="expense">Uscita</option></select></label><label class="field">Inserito da<select name="owner"><option>Carmen</option><option>Veronica</option></select></label></div><label class="field">Numero fattura / descrizione<input name="title" required></label><label class="field">Stato<select name="state" id="movement-state"></select></label><label class="field" id="counterpart-field">Cliente<input name="counterpart"></label><label class="field">Importo<input name="amount" type="number" min="0.01" step="0.01" required></label><label class="field">Scadenza<input name="due" type="date" value="${new Date().toISOString().slice(0,10)}"></label><label class="field hidden" id="category-field">Categoria<select name="cat"><option value="">Senza categoria</option>${categories.filter(c=>c.is_active).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></label></div><div class="modal-foot"><button type="button" class="icon" id="cancel">Annulla</button><button class="primary">Salva</button></div></form></div>`);document.querySelector('#cancel').onclick=()=>document.querySelector('#modal').remove();const kindSelect=document.querySelector('#new [name="kind"]'),stateSelect=document.querySelector('#movement-state'),syncMovementFields=()=>{const invoice=kindSelect.value==='invoice';document.querySelector('#counterpart-field').classList.toggle('hidden',!invoice);document.querySelector('#category-field').classList.toggle('hidden',invoice);stateSelect.innerHTML=invoice?'<option value="expected">Prevista</option><option value="awaiting">Da incassare</option><option value="collected">Incassata</option>':'<option value="planned">Da pagare</option><option value="paid">Pagata</option><option value="overdue">In ritardo</option>'};kindSelect.onchange=syncMovementFields;syncMovementFields();document.querySelector('#new').onsubmit=async e=>{e.preventDefault();let d=new FormData(e.target),kind=d.get('kind'),title=d.get('title').trim(),counterpart=kind==='invoice'?d.get('counterpart').trim():'Uscita';if(kind==='invoice'&&!counterpart){alert('Inserisci il cliente.');return}let data={kind,title,counterpart,amount:Number(d.get('amount')),movement_date:new Date().toISOString().slice(0,10),due_date:d.get('due')||null,state:d.get('state'),category_id:kind==='expense'?(d.get('cat')||null):null,entered_by:d.get('owner'),updated_by_name:d.get('owner')};let {data:created,error}=await supabase.from('iki_movements').insert(data).select('id').single();if(error){alert(error.message);return}freshMovementId=created?.id||null;document.querySelector('#modal').remove();await load();render();setTimeout(()=>{freshMovementId=null},1600)}}
async function start(){try{await load();render()}catch(e){root.innerHTML=`<div class="login"><div class="login-card"><h2>Problema di sincronizzazione</h2><p>${esc(e.message)}</p><button class="primary" onclick="location.reload()">Riprova</button></div></div>`}};
const {data:{session}}=await supabase.auth.getSession();session?start():login();if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');
</script>
</body></html>
