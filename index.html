<body>
<main id="root"></main>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const SUPABASE_URL=location.origin+'/api/supabase',SUPABASE_KEY='sb_publishable_p0hmFGquUZRtOA9EWGrZQw_A1uGWa_G';
const supabase=createClient(SUPABASE_URL,SUPABASE_KEY);
const root=document.querySelector('#root');let movements=[],categories=[],recurrings=[],goals=[],section='overview',selectedMonth=new Date().toISOString().slice(0,7),status='all',ownerFilter='all',freshMovementId=null,clientFilter='',monitorRange='month',monitorKind='all',monitorFrom='',monitorTo='';
const euro=n=>new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(n||0);const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const active=m=>m.state==='paid'||m.state==='collected';const monthItems=()=>movements.filter(m=>m.movement_date?.startsWith(selectedMonth));
function login(){root.innerHTML=`<div class="login"><form class="login-card" id="login"><img class="logo" src="/icons/iki-studio-logo.png"><h1>IKI Studio</h1><p>Area riservata a Carmen e Veronica</p><label class="field">Email condivisa<input type="email" name="email" required></label><label class="field">Password<input type="password" name="password" required></label><button class="primary">Accedi</button><div id="err" class="error"></div></form></div>`;document.querySelector('#login').onsubmit=async e=>{e.preventDefault();const form=e.target,d=new FormData(form),email=String(d.get('email')||'').trim(),password=String(d.get('password')||''),button=form.querySelector('.primary'),errorBox=document.querySelector('#err');button.disabled=true;button.textContent='Accesso…';errorBox.textContent='';let {error}=await supabase.auth.signInWithPassword({email,password});if(error){try{const response=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password})}),payload=await response.json();if(!response.ok)throw new Error(payload.error_description||payload.message||'Accesso non riuscito');const restored=await supabase.auth.setSession({access_token:payload.access_token,refresh_token:payload.refresh_token});if(restored.error)throw restored.error;error=null}catch(fallbackError){error=fallbackError}}if(error){errorBox.textContent='Accesso non riuscito: '+(error.message||'verifica le credenziali.');button.disabled=false;button.textContent='Accedi';return}start()}}
async function load(){const [a,b,c,d]=await Promise.all([supabase.from('iki_movements').select('*').order('movement_date',{ascending:false}),supabase.from('iki_categories').select('*').order('name'),supabase.from('iki_recurring_expenses').select('*').order('title'),supabase.from('iki_monthly_goals').select('*')]);if(a.error||b.error||c.error||d.error)throw Error(a.error?.message||b.error?.message||c.error?.message||d.error?.message);movements=a.data||[];categories=b.data||[];recurrings=c.data||[];goals=d.data||[]}
function nav(){const labels={overview:['Panoramica','Home'],monitor:['Monitor','Trend'],invoices:['Fatture','Fatture'],clients:['Clienti','Clienti'],recurring:['Ricorrenti','Ricorrenti'],goals:['Obiettivi','Obiettivi'],expenses:['Uscite','Uscite'],deadlines:['Scadenze','Date'],categories:['Gestione voci','Voci'],settings:['Impostazioni','Impostazioni'],more:['Altro','Altro']};return Object.keys(labels).map(x=>`<button class="${section===x?'active':''}" data-nav="${x}" data-short="${labels[x][1]}">${labels[x][0]}</button>`).join('')}
function row(m){const income=m.kind==='invoice';return `<div class="row"><div class="detail"><b>${esc(m.title)}</b><span>${income?esc(m.counterpart):esc(categories.find(c=>c.id===m.category_id)?.name||'Senza categoria')}</span></div><div class="amount">${income?'+':'−'} ${euro(m.amount)}<span class="state ${m.state}">${({expected:'Prevista',awaiting:'Da incassare',collected:'Incassata',planned:'Prevista',paid:'Pagata',overdue:'In ritardo'})[m.state]||m.state}</span></div></div>`};
function richRow(m){const income=m.kind==='invoice',state=({expected:'Prevista',awaiting:'Da incassare',collected:'Incassata',planned:'Prevista',paid:'Pagata',overdue:'In ritardo'})[m.state]||m.state;const control=section==='invoices'&&m.state==='expected'?`<button class="mini-action" data-set-state="${m.id}" data-next-state="awaiting">Segna da incassare</button>`:section==='invoices'&&m.state==='awaiting'?`<button class="mini-action" data-set-state="${m.id}" data-next-state="collected">Segna incassata</button>`:section==='expenses'&&(m.state==='planned'||m.state==='overdue')?`<button class="mini-action" data-set-state="${m.id}" data-next-state="paid">Segna pagata</button>`:'';return `<div class="table-row ${m.id===freshMovementId?'is-new':''}"><time>${m.movement_date?new Date(m.movement_date+'T12:00:00').toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit',year:'numeric'}):'—'}</time><div class="table-detail"><b>${esc(m.title)}</b><span>${income?esc(m.counterpart):esc(categories.find(c=>c.id===m.category_id)?.name||'Senza categoria')}</span></div><span class="kind">${income?'Fattura':'Uscita'}</span><div class="state-cell"><span class="state ${m.state}">${state}</span>${control}</div><span class="due">${m.due_date?'Scade '+new Date(m.due_date+'T12:00:00').toLocaleDateString('it-IT',{day:'2-digit',month:'short'}):'—'}</span><strong class="amount">${income?'+':'−'} ${euro(m.amount)}</strong></div>`}
function tableRows(items){return `<div class="table-head"><span>DATA</span><span>DESCRIZIONE</span><span>TIPO</span><span>STATO</span><span>SCADENZA</span><span>IMPORTO</span></div>${items.map(richRow).join('')}`};
function overview(){const ms=monthItems(),inc=ms.filter(m=>m.kind==="invoice"&&m.state==="collected").reduce((s,m)=>s+Number(m.amount),0),out=ms.filter(m=>m.kind==="expense"&&m.state==="paid").reduce((s,m)=>s+Number(m.amount),0),forecastIncome=ms.filter(m=>m.kind==="invoice").reduce((s,m)=>s+Number(m.amount),0),forecastOut=ms.filter(m=>m.kind==="expense").reduce((s,m)=>s+Number(m.amount),0),forecast=forecastIncome-forecastOut,expected=ms.filter(m=>m.kind==="invoice"&&(m.state==="expected"||m.state==="awaiting")).reduce((s,m)=>s+Number(m.amount),0),toPay=ms.filter(m=>m.kind==="expense"&&!active(m)).reduce((s,m)=>s+Number(m.amount),0),safeToSpend=inc-out-toPay,insight=safeToSpend<0?`Le uscite ancora da pagare superano il saldo disponibile di ${euro(Math.abs(safeToSpend))}.`:expected>0?`Se incassi le fatture aperte, la proiezione del mese sale a ${euro(forecast)}.`:`Tutto in ordine: non risultano incassi o pagamenti aperti per questo mese.`,tasks=ms.filter(m=>!active(m)&&m.due_date).sort((a,b)=>a.due_date.localeCompare(b.due_date)).slice(0,4),stateName={expected:"Prevista",awaiting:"Da incassare",collected:"Incassata",planned:"Da pagare",paid:"Pagata",overdue:"In ritardo"},taskRow=m=>{const income=m.kind==="invoice",date=new Date(m.due_date+"T12:00:00").toLocaleDateString("it-IT",{day:"2-digit",month:"short"});return `<button class="task-row" data-task-section="${income?"invoices":"expenses"}"><span class="task-type ${income?"income":"expense"}">${income?"Fattura":"Uscita"}</span><span class="task-copy"><b>${esc(m.title)}</b><small>${income?esc(m.counterpart):esc(categories.find(c=>c.id===m.category_id)?.name||"Senza categoria")} · ${stateName[m.state]}</small></span><span class="task-value"><time>${date}</time><strong>${income?"+":"−"} ${euro(m.amount)}</strong></span><span class="task-arrow">›</span></button>`};return `<section class="home-period"><div><span class="eyebrow">PANORAMICA</span><h1>Il mese, sotto controllo.</h1></div><label>Periodo <input type="month" value="${selectedMonth}" id="month"></label></section><div class="home-grid"><section class="balance-command"><div class="balance-top"><span class="eyebrow accent">DISPONIBILE ORA</span><span class="live-mark">●</span></div><strong>${euro(inc-out)}</strong><div class="forecast-line"><div><span>PROIEZIONE FINE MESE</span><b>${euro(forecast)}</b></div><small>Include ${euro(expected)} tra fatture previste e da incassare.</small></div><div class="balance-meta"><span>Incassato <b>${euro(inc)}</b></span><span>Pagato <b>${euro(out)}</b></span></div></section><section class="task-panel"><div class="panel-top"><div><span class="eyebrow">DA FARE</span><h2>${tasks.length?`${tasks.length} movimenti da seguire`:"Niente in sospeso"}</h2></div><button class="quiet-link" data-nav="deadlines">Vedi tutto ›</button></div><div class="task-list">${tasks.length?tasks.map(taskRow).join(""):`<div class="calm-empty">Nessuna scadenza aperta. Il mese è in ordine.</div>`}</div></section></div><section class="copilot-panel"><div class="copilot-intro"><span class="eyebrow accent">COPILOTA IKI</span><h2>La risposta che serve oggi.</h2><p>${insight}</p></div><div class="copilot-metrics"><div><span>PUOI SPENDERE</span><strong class="${safeToSpend<0?"negative":""}">${euro(safeToSpend)}</strong><small>Saldo reale meno uscite da pagare</small></div><div><span>DA INCASSARE</span><strong>${euro(expected)}</strong><small>Fatture previste e da incassare</small></div><div><span>DA PAGARE</span><strong>${euro(toPay)}</strong><small>Uscite ancora aperte</small></div></div></section><section class="ledger-panel"><div class="panel-top"><div><span class="eyebrow">REGISTRO</span><h2>Movimenti del mese</h2></div><button class="quiet-link" data-nav="invoices">Apri fatture ›</button></div><div class="table">${ms.length?tableRows(ms.slice(0,7)):`<div class="calm-empty">Nessun movimento registrato in questo periodo.</div>`}</div><footer class="ledger-foot"><span>Entrate <b>${euro(forecastIncome)}</b></span><span>Uscite <b>${euro(forecastOut)}</b></span><span>Proiezione <b>${euro(forecast)}</b></span></footer></section>`}
function list(kind){let items=monthItems().filter(m=>m.kind===kind&&(status==='all'||m.state===status)&&(kind!=='invoice'||ownerFilter==='all'||m.entered_by===ownerFilter));const total=items.reduce((sum,m)=>sum+Number(m.amount||0),0),incassato=items.filter(m=>m.state==='collected').reduce((sum,m)=>sum+Number(m.amount||0),0),daIncassare=items.filter(m=>m.state==='awaiting'||m.state==='expected').reduce((sum,m)=>sum+Number(m.amount||0),0);const opts=kind==='invoice'?[['all','Tutte'],['expected','Previste'],['awaiting','Da incassare'],['collected','Incassate']]:[['all','Tutte'],['planned','Previste'],['paid','Pagate'],['overdue','In ritardo']];return `<div class="section-title"><h1>${kind==='invoice'?'Fatture':'Uscite'}</h1><div class="filter">${kind==='invoice'?`<select id="owner-filter"><option value="all" ${ownerFilter==='all'?'selected':''}>Carmen e Veronica</option><option value="Carmen" ${ownerFilter==='Carmen'?'selected':''}>Solo Carmen</option><option value="Veronica" ${ownerFilter==='Veronica'?'selected':''}>Solo Veronica</option></select>`:''}<select id="status">${opts.map(o=>`<option value="${o[0]}" ${status===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></div></div><section class="invoice-summary"><div><span>${kind==='invoice'?'FATTURE NEL FILTRO':'USCITE NEL FILTRO'}</span><strong>${euro(total)}</strong></div><div><span>${kind==='invoice'?'INCASSATO':'PAGATO'}</span><strong>${euro(kind==='invoice'?incassato:items.filter(m=>m.state==='paid').reduce((sum,m)=>sum+Number(m.amount||0),0))}</strong></div><div><span>${kind==='invoice'?'ATTESO / DA INCASSARE':'DA PAGARE'}</span><strong class="accent-value">${euro(kind==='invoice'?daIncassare:items.filter(m=>m.state==='planned'||m.state==='overdue').reduce((sum,m)=>sum+Number(m.amount||0),0))}</strong></div></section><div class="table">${items.length?tableRows(items):'<div class="empty">Nessun movimento per questi filtri.</div>'}</div>`}
function clients(){const all=movements.filter(m=>m.kind==='invoice'),byClient={};all.forEach(m=>{const name=m.counterpart||'Senza cliente';if(!byClient[name])byClient[name]={name,total:0,open:0,count:0,last:''};const c=byClient[name];c.total+=Number(m.amount||0);c.count++;if(m.state==='expected'||m.state==='awaiting')c.open+=Number(m.amount||0);if(!c.last||m.movement_date>c.last)c.last=m.movement_date});const rows=Object.values(byClient).filter(c=>c.name.toLowerCase().includes(clientFilter.toLowerCase())).sort((a,b)=>b.total-a.total);return `<div class="section-title"><div><h1>Clienti</h1><small class="clients-subtitle">Tutto quello che serve sapere, senza una rubrica complicata.</small></div></div><div class="filter" style="margin:0 0 16px;max-width:390px"><input id="client-search" value="${esc(clientFilter)}" placeholder="Cerca cliente..." style="flex:1;padding:10px;border:1px solid var(--line);border-radius:9px;background:#fff"><button class="primary" id="apply-client-search">Cerca</button></div><section class="client-summary"><div><span>CLIENTI ATTIVI</span><strong>${rows.length}</strong></div><div><span>FATTURATO COMPLESSIVO</span><strong>${euro(rows.reduce((s,c)=>s+c.total,0))}</strong></div><div><span>ANCORA DA INCASSARE</span><strong class="accent-value">${euro(rows.reduce((s,c)=>s+c.open,0))}</strong></div></section><section class="client-list">${rows.length?rows.map(c=>`<article class="client-row" data-client-name="${esc(c.name)}" style="cursor:pointer"><div class="client-avatar">${esc(c.name.slice(0,1).toUpperCase())}</div><div class="client-name"><b>${esc(c.name)}</b><small>${c.count} ${c.count===1?'fattura':'fatture'} · ultima ${c.last?new Date(c.last+'T12:00:00').toLocaleDateString('it-IT',{day:'2-digit',month:'short',year:'numeric'}):'—'}</small></div><div class="client-stat"><span>FATTURATO</span><b>${euro(c.total)}</b></div><div class="client-stat open"><span>APERTO</span><b>${euro(c.open)}</b></div></article>`).join(''):'<div class="empty">Quando inserirai le fatture, qui vedrai i tuoi clienti.</div>'}</section>`}


function recurring(){let rows=recurrings.map(r=>'<div class="row"><div class="detail"><b>'+esc(r.title)+'</b><span>Ogni mese, giorno '+r.day_of_month+'</span></div><div class="amount"><b>− '+euro(r.amount)+'</b><span class="state paid">Attiva</span></div></div>').join('');return '<div class="section-title"><h1>Uscite ricorrenti</h1><button class="primary" id="add-recurring">＋ Aggiungi</button></div><section class="panel">'+(rows||'<div class="empty">Aggiungi affitto, software o utenze fisse.</div>')+'</section>'}
function goalsView(){let goal=goals.find(g=>g.period===selectedMonth),income=monthItems().filter(m=>m.kind==='invoice').reduce((n,m)=>n+Number(m.amount||0),0),target=Number(goal?.amount||0),pct=target?Math.min(100,Math.round(income/target*100)):0;return '<div class="section-title"><h1>Obiettivo del mese</h1><button class="primary" id="set-goal">'+(target?'Modifica':'Imposta')+'</button></div><section class="panel"><span class="eyebrow">ENTRATE DEL MESE</span><div class="balance">'+(target?euro(income):'—')+'</div><div class="track" style="margin:16px 0"><div class="fill" style="width:'+pct+'%"></div></div><p style="color:var(--muted);margin:0">'+(target?pct+'% raggiunto su '+euro(target):'Imposta un obiettivo semplice per questo mese.')+'</p></section>'}
function monitor(){const year=Number(selectedMonth.slice(0,4)),rangeLabels={month:'Mese selezionato',year:'Anno selezionato',previous:'Anno precedente',custom:'Intervallo personalizzato'};let items=movements.filter(m=>{const d=m.movement_date||'';if(monitorRange==='month')return d.startsWith(selectedMonth);if(monitorRange==='year')return d.startsWith(String(year));if(monitorRange==='previous')return d.startsWith(String(year-1));return (!monitorFrom||d>=monitorFrom)&&(!monitorTo||d<=monitorTo)}).filter(m=>monitorKind==='all'||m.kind===monitorKind);const income=items.filter(m=>m.kind==='invoice').reduce((sum,m)=>sum+Number(m.amount||0),0),expenses=items.filter(m=>m.kind==='expense').reduce((sum,m)=>sum+Number(m.amount||0),0),balance=income-expenses;const exp={},inc={};items.filter(m=>m.kind==='expense').forEach(m=>{let n=categories.find(c=>c.id===m.category_id)?.name||'Senza categoria';exp[n]=(exp[n]||0)+Number(m.amount)});items.filter(m=>m.kind==='invoice').forEach(m=>inc[m.counterpart]=(inc[m.counterpart]||0)+Number(m.amount));const bars=(o,green=false)=>{let e=Object.entries(o).sort((a,b)=>b[1]-a[1]),max=e[0]?.[1]||1;return e.length?e.map(([n,v])=>`<div class="bar"><span>${esc(n)}</span><div class="track"><div class="fill ${green?'green':''}" style="width:${v/max*100}%"></div></div><b>${euro(v)}</b></div>`).join(''):'<div class="empty">Nessun dato nel periodo scelto.</div>'};return `<div class="section-title monitor-title"><div><h1>Monitor finanziario</h1><small>${rangeLabels[monitorRange]}</small></div><div class="filter monitor-filter"><select id="monitor-range"><option value="month" ${monitorRange==='month'?'selected':''}>Mese selezionato</option><option value="year" ${monitorRange==='year'?'selected':''}>Tutto l’anno</option><option value="previous" ${monitorRange==='previous'?'selected':''}>Anno precedente</option><option value="custom" ${monitorRange==='custom'?'selected':''}>Periodo personalizzato</option></select><select id="monitor-kind"><option value="all" ${monitorKind==='all'?'selected':''}>Entrate e uscite</option><option value="invoice" ${monitorKind==='invoice'?'selected':''}>Solo entrate</option><option value="expense" ${monitorKind==='expense'?'selected':''}>Solo uscite</option></select></div></div>${monitorRange==='custom'?`<div class="monitor-dates"><label>Dal <input type="date" id="monitor-from" value="${monitorFrom}"></label><label>Al <input type="date" id="monitor-to" value="${monitorTo}"></label></div>`:''}<section class="monitor-summary"><div><span>ENTRATE</span><strong>${euro(income)}</strong></div><div><span>USCITE</span><strong>${euro(expenses)}</strong></div><div><span>SALDO DEL PERIODO</span><strong class="${balance<0?'negative':''}">${euro(balance)}</strong></div></section><div class="charts">${monitorKind!=='invoice'?`<section class="panel"><h3>Dove spendete di più</h3>${bars(exp)}</section>`:''}${monitorKind!=='expense'?`<section class="panel"><h3>Da chi fatturate di più</h3>${bars(inc,true)}</section>`:''}</div>`}
function deadlines(){let items=movements.filter(m=>!active(m)&&m.due_date).sort((a,b)=>a.due_date.localeCompare(b.due_date));return `<div class="section-title"><h1>Scadenze</h1></div><div class="table">${items.length?tableRows(items):'<div class="empty">Nessuna scadenza aperta.</div>'}</div>`}
function more(){return `<div class="section-title"><h1>Altro</h1></div><section class="mobile-more panel"><button data-nav="deadlines"><span>◷</span><b>Scadenze</b><small>Pagamenti e incassi da seguire</small><i>›</i></button><button data-nav="categories"><span>☷</span><b>Gestione voci</b><small>Categorie per le uscite</small><i>›</i></button><button data-nav="clients"><span>◉</span><b>Clienti</b><small>Fatture, totale e incassi aperti</small><i>›</i></button><button data-nav="settings"><span>⚙</span><b>Impostazioni</b><small>Account, sincronizzazione e archivio</small><i>›</i></button></section>`}
function cats(){const activeCats=categories.filter(c=>c.is_active),archived=categories.filter(c=>!c.is_active);return `<div class="section-title"><h1>Gestione voci</h1><button class="primary" id="add-category">＋ Aggiungi voce</button></div><section class="panel"><p style="color:var(--muted);margin-top:0">Le voci servono solo per organizzare le uscite. Disattivandole non cancelli lo storico: semplicemente non compariranno più quando aggiungi una nuova uscita.</p>${activeCats.map(c=>`<div class="row"><b>${esc(c.name)}</b><button class="icon" data-disable-cat="${c.id}">Disattiva</button></div>`).join('')||'<div class="empty">Nessuna voce attiva.</div>'}</section>${archived.length?`<section class="panel" style="margin-top:20px"><h3>Voci archiviate</h3>${archived.map(c=>`<div class="row"><b>${esc(c.name)}</b><button class="icon" data-restore-cat="${c.id}">Riattiva</button></div>`).join('')}</section>`:''}`}
function settings(){return `<div class="section-title"><h1>Impostazioni</h1></div><div class="settings-grid"><section class="settings-card"><span class="eyebrow">ACCOUNT</span><h2>Accesso condiviso</h2><p>Esci da questo dispositivo per accedere con un altro profilo. I dati di IKI Studio restano sincronizzati e non vengono cancellati.</p><button class="icon settings-action" id="sign-out">Esci / cambia account <b>›</b></button></section><section class="settings-card"><span class="eyebrow">SICUREZZA</span><h2>Cambia password</h2><p>Imposta una nuova password condivisa. Usala poi per accedere da Mac, iPhone e browser.</p><button class="icon settings-action" id="change-password">Cambia password <b>›</b></button></section><section class="settings-card"><span class="eyebrow">SINCRONIZZAZIONE</span><h2>Dati sincronizzati</h2><p>I dati sono salvati in Supabase e condivisi tra Mac e iPhone. Questo tasto ricarica gli ultimi dati disponibili.</p><button class="icon settings-action" id="settings-refresh">Ricarica dati <b>↻</b></button></section><section class="settings-card danger-card"><span class="eyebrow">AREA RISERVATA</span><h2>Azzera IKI Studio</h2><p>Cancella definitivamente tutti i movimenti e tutte le voci di uscita, per ricominciare da zero.</p><button class="danger-button" id="reset-all">Azzera tutti i dati <b>›</b></button></section></div>`}
function render(){let body={overview,monitor,invoices:()=>list('invoice'),expenses:()=>list('expense'),clients,recurring,goals:goalsView,deadlines,categories:cats,settings,more}[section]();root.innerHTML=`<div class="app"><aside class="side"><img class="logo" src="/icons/iki-studio-logo.png"><nav class="nav">${nav()}</nav><small>SOCIE<br><b>Carmen · Veronica</b></small></aside><div class="main"><header class="top"><div><small style="color:var(--muted)">Bentornate,</small><h2>IKI Studio</h2></div><span class="push"></span><button class="icon" id="refresh" title="Aggiorna">↻</button><button class="icon export-button" id="export" title="Esporta archivio">⇩ Esporta</button><button class="primary" id="add">＋ Aggiungi</button></header><main class="content page-enter">${body}</main></div></div>`;document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{section=b.dataset.nav;status='all';ownerFilter='all';render()});document.querySelector('#refresh').onclick=async()=>{await load();render()};document.querySelector('#export').onclick=exportModal;document.querySelector('#add').onclick=modal;if(document.querySelector('#month'))document.querySelector('#month').onchange=e=>{selectedMonth=e.target.value;render()};if(document.querySelector('#status'))document.querySelector('#status').onchange=e=>{status=e.target.value;render()};document.querySelectorAll('[data-client-name]').forEach(row=>row.onclick=()=>{const n=row.dataset.clientName,items=movements.filter(m=>m.kind==='invoice'&&m.counterpart===n),inc=items.filter(m=>m.state==='collected').reduce((a,m)=>a+Number(m.amount||0),0),open=items.filter(m=>m.state!=='collected').reduce((a,m)=>a+Number(m.amount||0),0);alert(n+'\n\nFatturato: '+euro(items.reduce((a,m)=>a+Number(m.amount||0),0))+'\nIncassato: '+euro(inc)+'\nDa incassare: '+euro(open)+'\n\nFatture:\n'+items.map(m=>m.movement_date+' · '+m.title+' · '+euro(m.amount)).join('\n'))});if(document.querySelector('#apply-client-search'))document.querySelector('#apply-client-search').onclick=()=>{clientFilter=document.querySelector('#client-search').value;render()};if(document.querySelector('#client-search'))document.querySelector('#client-search').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();clientFilter=e.target.value;render()}};if(document.querySelector('#owner-filter'))document.querySelector('#owner-filter').onchange=e=>{ownerFilter=e.target.value;render()};if(document.querySelector('#monitor-range'))document.querySelector('#monitor-range').onchange=e=>{monitorRange=e.target.value;render()};if(document.querySelector('#monitor-kind'))document.querySelector('#monitor-kind').onchange=e=>{monitorKind=e.target.value;render()};if(document.querySelector('#monitor-from'))document.querySelector('#monitor-from').onchange=e=>{monitorFrom=e.target.value;render()};if(document.querySelector('#monitor-to'))document.querySelector('#monitor-to').onchange=e=>{monitorTo=e.target.value;render()};document.querySelectorAll('[data-task-section]').forEach(b=>b.onclick=()=>{section=b.dataset.taskSection;status='all';render()});if(document.querySelector('#add-recurring'))document.querySelector('#add-recurring').onclick=async()=>{const title=prompt('Nome della spesa ricorrente (es. Affitto)');if(!title)return;const amount=Number(prompt('Importo mensile'));const day=Number(prompt('Giorno del mese (1-28)','1'));if(!amount||!day)return;const {error}=await supabase.from('iki_recurring_expenses').insert({title,amount,day_of_month:day});if(error)alert(error.message);else{await load();render()}};if(document.querySelector('#set-goal'))document.querySelector('#set-goal').onclick=async()=>{const current=goals.find(g=>g.period===selectedMonth);const amount=Number(prompt('Obiettivo entrate per '+selectedMonth,current?.amount||''));if(!amount)return;const {error}=current?await supabase.from('iki_monthly_goals').update({amount}).eq('id',current.id):await supabase.from('iki_monthly_goals').insert({period:selectedMonth,amount});if(error)alert(error.message);else{await load();render()}};if(document.querySelector('#sign-out'))document.querySelector('#sign-out').onclick=async()=>{await supabase.auth.signOut();login()};if(document.querySelector('#change-password'))document.querySelector('#change-password').onclick=passwordModal;if(document.querySelector('#settings-refresh'))document.querySelector('#settings-refresh').onclick=async()=>{await load();render()};if(document.querySelector('#reset-all'))document.querySelector('#reset-all').onclick=resetModal;if(document.querySelector('#add-category'))document.querySelector('#add-category').onclick=categoryModal;document.querySelectorAll('[data-disable-cat]').forEach(b=>b.onclick=async()=>{let {error}=await supabase.from('iki_categories').update({is_active:false}).eq('id',b.dataset.disableCat);if(error){alert(error.message);return}await load();render()});document.querySelectorAll('[data-restore-cat]').forEach(b=>b.onclick=async()=>{let {error}=await supabase.from('iki_categories').update({is_active:true}).eq('id',b.dataset.restoreCat);if(error){alert(error.message);return}await load();render()});document.querySelectorAll('[data-set-state]').forEach(b=>b.onclick=async()=>{b.disabled=true;let {error}=await supabase.from('iki_movements').update({state:b.dataset.nextState}).eq('id',b.dataset.setState);if(error){alert(error.message);b.disabled=false;return}await load();render()})}
function exportModal(){const [year,month]=selectedMonth.split('-').map(Number),lastDay=String(new Date(year,month,0).getDate()).padStart(2,'0');root.insertAdjacentHTML('beforeend',`<div class="modal" id="modal"><form class="modal-card" id="export-form"><div class="modal-head"><b>Esporta archivio</b></div><div class="modal-body"><p style="margin:0;color:var(--muted);line-height:1.45">Scegli il periodo e scarica un file CSV. Puoi conservarlo su chiavetta, disco esterno o aprirlo con Excel.</p><div class="two"><label class="field">Dal<input name="from" type="date" value="${selectedMonth}-01" required></label><label class="field">Al<input name="to" type="date" value="${selectedMonth}-${lastDay}" required></label></div><label class="field">Cosa esportare<select name="kind"><option value="all">Tutto</option><option value="invoice">Solo fatture</option><option value="expense">Solo uscite</option></select></label></div><div class="modal-foot"><button type="button" class="icon" id="cancel">Annulla</button><button class="primary">Scarica CSV</button></div></form></div>`);document.querySelector('#cancel').onclick=()=>document.querySelector('#modal').remove();document.querySelector('#export-form').onsubmit=e=>{e.preventDefault();const d=new FormData(e.target),from=d.get('from'),to=d.get('to'),kind=d.get('kind'),items=movements.filter(m=>m.movement_date>=from&&m.movement_date<=to&&(kind==='all'||m.kind===kind));const q=v=>'"'+String(v??'').replaceAll('"','""')+'"',rows=[['Data','Tipo','Descrizione','Cliente / Categoria','Importo','Stato','Scadenza','Inserito da'],...items.map(m=>[m.movement_date,m.kind==='invoice'?'Fattura':'Uscita',m.title,m.kind==='invoice'?m.counterpart:(categories.find(c=>c.id===m.category_id)?.name||''),Number(m.amount||0).toFixed(2),({expected:'Prevista',awaiting:'Da incassare',collected:'Incassata',planned:'Da pagare',paid:'Pagata',overdue:'In ritardo'})[m.state]||m.state,m.due_date||'',m.entered_by||''])].map(r=>r.map(q).join(';')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\\uFEFF'+rows],{type:'text/csv;charset=utf-8'}));a.download='iki-studio-'+from+'_'+to+'.csv';document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},0);document.querySelector('#modal').remove()}}
function passwordModal(){root.insertAdjacentHTML('beforeend',`<div class="modal" id="modal"><form class="modal-card" id="password-form"><div class="modal-head"><b>Cambia password</b></div><div class="modal-body"><p style="margin:0;color:var(--muted);line-height:1.5">Scegli una nuova password condivisa. Non modifica fatture, uscite o altri dati dell’app.</p><label class="field">Nuova password<input name="password" type="password" minlength="8" autocomplete="new-password" required autofocus></label><label class="field">Conferma password<input name="confirm" type="password" minlength="8" autocomplete="new-password" required></label></div><div class="modal-foot"><button type="button" class="icon" id="cancel">Annulla</button><button class="primary">Salva password</button></div></form></div>`);document.querySelector('#cancel').onclick=()=>document.querySelector('#modal').remove();document.querySelector('#password-form').onsubmit=async e=>{e.preventDefault();const data=new FormData(e.target),password=String(data.get('password')||''),confirm=String(data.get('confirm')||'');if(password.length<8){alert('La password deve contenere almeno 8 caratteri.');return}if(password!==confirm){alert('Le due password non coincidono.');return}const submit=e.target.querySelector('.primary');submit.disabled=true;submit.textContent='Salvataggio…';const {error}=await supabase.auth.updateUser({password});if(error){alert('Non è stato possibile cambiare la password: '+error.message);submit.disabled=false;submit.textContent='Salva password';return}document.querySelector('#modal').remove();alert('Password aggiornata. Ora puoi usarla per accedere anche da Mac e browser.')}}
function resetModal(){root.insertAdjacentHTML('beforeend',`<div class="modal" id="modal"><form class="modal-card" id="reset-form"><div class="modal-head"><b>Azzera tutti i dati</b></div><div class="modal-body"><p style="margin:0;color:var(--muted);line-height:1.5">Questa operazione cancella definitivamente tutte le fatture, le uscite e le voci personalizzate. Non può essere annullata.</p><label class="field">Per confermare, scrivi <b>AZZERA</b><input name="confirm" autocomplete="off" required autofocus></label></div><div class="modal-foot"><button type="button" class="icon" id="cancel">Annulla</button><button class="danger-button">Azzera definitivamente</button></div></form></div>`);document.querySelector('#cancel').onclick=()=>document.querySelector('#modal').remove();document.querySelector('#reset-form').onsubmit=async e=>{e.preventDefault();if(new FormData(e.target).get('confirm').trim().toUpperCase()!=='AZZERA'){alert('Scrivi AZZERA per confermare.');return}const submit=e.target.querySelector('.danger-button');submit.disabled=true;const [movementsResult,categoriesResult]=await Promise.all([supabase.from('iki_movements').delete().not('id','is',null),supabase.from('iki_categories').delete().not('id','is',null)]);const error=movementsResult.error||categoriesResult.error;if(error){alert(error.message);submit.disabled=false;return}document.querySelector('#modal').remove();await load();section='overview';render()}}
function categoryModal(){root.insertAdjacentHTML('beforeend',`<div class="modal" id="modal"><form class="modal-card" id="new-category"><div class="modal-head"><b>Nuova voce di uscita</b></div><div class="modal-body"><label class="field">Nome della voce<input name="name" placeholder="Es. Internet" required autofocus></label></div><div class="modal-foot"><button type="button" class="icon" id="cancel">Annulla</button><button class="primary">Aggiungi voce</button></div></form></div>`);document.querySelector('#cancel').onclick=()=>document.querySelector('#modal').remove();document.querySelector('#new-category').onsubmit=async e=>{e.preventDefault();const name=new FormData(e.target).get('name').trim();let {error}=await supabase.from('iki_categories').insert({name,is_active:true});if(error){alert(error.message);return}document.querySelector('#modal').remove();await load();render()}}
function modal(){root.insertAdjacentHTML('beforeend',`<div class="modal" id="modal"><form class="modal-card" id="new"><div class="modal-head"><b>Nuovo movimento</b></div><div class="modal-body"><div class="two"><label class="field">Tipo<select name="kind"><option value="invoice">Fattura</option><option value="expense">Uscita</option></select></label><label class="field">Inserito da<select name="owner"><option>Carmen</option><option>Veronica</option></select></label></div><label class="field">Numero fattura / descrizione<input name="title" required></label><label class="field">Stato<select name="state" id="movement-state"></select></label><label class="field" id="counterpart-field">Cliente<input name="counterpart"></label><label class="field">Importo<input name="amount" type="number" min="0.01" step="0.01" required></label><label class="field">Scadenza<input name="due" type="date" value="${new Date().toISOString().slice(0,10)}"></label><label class="field hidden" id="category-field">Categoria<select name="cat"><option value="">Senza categoria</option>${categories.filter(c=>c.is_active).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></label></div><div class="modal-foot"><button type="button" class="icon" id="cancel">Annulla</button><button class="primary">Salva</button></div></form></div>`);document.querySelector('#cancel').onclick=()=>document.querySelector('#modal').remove();const kindSelect=document.querySelector('#new [name="kind"]'),stateSelect=document.querySelector('#movement-state'),syncMovementFields=()=>{const invoice=kindSelect.value==='invoice';document.querySelector('#counterpart-field').classList.toggle('hidden',!invoice);document.querySelector('#category-field').classList.toggle('hidden',invoice);stateSelect.innerHTML=invoice?'<option value="expected">Prevista</option><option value="awaiting">Da incassare</option><option value="collected">Incassata</option>':'<option value="planned">Da pagare</option><option value="paid">Pagata</option><option value="overdue">In ritardo</option>'};kindSelect.onchange=syncMovementFields;syncMovementFields();document.querySelector('#new').onsubmit=async e=>{e.preventDefault();let d=new FormData(e.target),kind=d.get('kind'),title=d.get('title').trim(),counterpart=kind==='invoice'?d.get('counterpart').trim():'Uscita';if(kind==='invoice'&&!counterpart){alert('Inserisci il cliente.');return}let data={kind,title,counterpart,amount:Number(d.get('amount')),movement_date:new Date().toISOString().slice(0,10),due_date:d.get('due')||null,state:d.get('state'),category_id:kind==='expense'?(d.get('cat')||null):null,entered_by:d.get('owner'),updated_by_name:d.get('owner')};let {data:created,error}=await supabase.from('iki_movements').insert(data).select('id').single();if(error){alert(error.message);return}freshMovementId=created?.id||null;document.querySelector('#modal').remove();await load();render();setTimeout(()=>{freshMovementId=null},1600)}}
async function start(){try{await load();render()}catch(e){root.innerHTML=`<div class="login"><div class="login-card"><h2>Problema di sincronizzazione</h2><p>${esc(e.message)}</p><button class="primary" onclick="location.reload()">Riprova</button></div></div>`}};
const {data:{session}}=await supabase.auth.getSession();session?start():login();if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');
</script>
